plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.mezobereny.mbapp'
    compileSdk 36

    defaultConfig {
        applicationId "hu.mezobereny.mbapp"
        minSdk 23

        // A Google Play évente emeli a megcélzott API-szint alsó határát. A 36-os
        // szinttel az Android 16 él-a-élig (edge-to-edge) megjelenése lép életbe,
        // amit az elrendezés a fitsSystemWindows beállítással kezel.
        targetSdk 36

        versionCode 1
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
}
